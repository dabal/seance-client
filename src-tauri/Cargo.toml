[package]
name = "seance"
version = "0.1.0"
description = "A modern, cross-platform VNC client"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "seance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rand = "0.8"
des = "0.8"
aes = "0.8"
md-5 = "0.10"
num-bigint = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
flate2 = "1"
png = "0.17"
base64 = "0.22"
sha2 = "0.10"
